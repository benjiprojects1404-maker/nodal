# Foundry config for the NodalRouter test suite (fuzz + invariant). The frontend build doesn't use this.
# Run: forge test        (CI profile with more runs: FOUNDRY_PROFILE=ci forge test)
[profile.default]
src = "test/foundry"
test = "test/foundry"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts@5.0.2/=node_modules/@openzeppelin/contracts/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 100
