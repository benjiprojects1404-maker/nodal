<svg width="680" height="616" viewBox="0 0 680 616" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How Nodal routes a trade</title>
<desc>A trade is submitted, queried in parallel across every registered liquidity source, ranked by net output after fees, executed through the best one, then split between the user and the treasury.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="616" fill="#FFFFFF"/>

<line x1="340" y1="96" x2="165" y2="152" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="355" y2="152" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="96" x2="530" y2="152" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="165" y1="208" x2="340" y2="280" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="355" y1="208" x2="340" y2="280" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="530" y1="208" x2="340" y2="280" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="336" x2="340" y2="400" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="245" y2="520" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="340" y1="456" x2="438" y2="520" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

<!-- Submit a trade (gray = neutral start) -->
<g>
<rect x="230" y="40" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Submit a trade</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Pick tokens and amount</text>
</g>

<!-- First source (gray = not yet live) -->
<g>
<rect x="70" y="152" width="190" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="165" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">DEX source A</text>
<text x="165" y="188" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Registered once live</text>
</g>

<!-- Second source (gray = not yet live) -->
<g>
<rect x="280" y="152" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="355" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">DEX source B</text>
<text x="355" y="188" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Registered once live</text>
</g>

<!-- More sources (gray) -->
<g>
<rect x="450" y="152" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="530" y="170" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">More sources</text>
<text x="530" y="188" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Added over time</text>
</g>

<!-- Compare net output (purple = decision logic) -->
<g>
<rect x="252" y="280" width="176" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="298" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Compare net output</text>
<text x="340" y="316" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">Fees already applied</text>
</g>

<!-- Execute best route (coral = action) -->
<g>
<rect x="235" y="400" width="210" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="418" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#712B13">Execute best route</text>
<text x="340" y="436" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">One wallet signature</text>
</g>

<!-- You receive (teal) -->
<g>
<rect x="158" y="520" width="175" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="245" y="538" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">You receive</text>
<text x="245" y="556" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Net of routing fee</text>
</g>

<!-- Treasury (purple) -->
<g>
<rect x="353" y="520" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="438" y="538" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">Treasury</text>
<text x="438" y="556" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">0.15% routing fee</text>
</g>
</svg>
