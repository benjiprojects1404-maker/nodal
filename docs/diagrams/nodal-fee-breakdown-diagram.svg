<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How Nodal's routing fee is calculated</title>
<desc>A quoted swap output is split into two parts: 99.85% goes to the user, and 0.15% goes to Nodal's treasury as the routing fee. Example shown: a route quoting 500 USDC splits into 499.25 to the user and 0.75 to the treasury.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
  <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="320" fill="#FFFFFF"/>

<line x1="340" y1="96" x2="245" y2="160" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>
<line x1="340" y1="96" x2="438" y2="160" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow2)"/>

<g>
<rect x="230" y="40" width="220" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="58" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#444441">Route quotes 500 USDC</text>
<text x="340" y="76" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Gross output, before fee</text>
</g>

<g>
<rect x="158" y="160" width="175" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="245" y="180" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041">499.25 USDC</text>
<text x="245" y="198" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">To you, 99.85%</text>
</g>

<g>
<rect x="353" y="160" width="170" height="64" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="438" y="180" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489">0.75 USDC</text>
<text x="438" y="198" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#534AB7">To treasury, 0.15%</text>
</g>

<rect x="158" y="256" width="365" height="16" rx="4" fill="none" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="158" y="256" width="364" height="16" rx="4" fill="#5DCAA5" stroke="none"/>
<rect x="521" y="256" width="2" height="16" fill="#7F77DD" stroke="none"/>
<text x="340" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">Bar shows the same 500 USDC split to scale</text>
</svg>
